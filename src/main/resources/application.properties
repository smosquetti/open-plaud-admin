spring.application.name=openplaud

spring.datasource.url=jdbc:postgresql://localhost:5432/openplaud
spring.datasource.username=admin
spring.datasource.password=admin

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

ejabberd.base-url=http://localhost:5280/api
ejabberd.host=localhost
ejabberd.muc-service=conference
ejabberd.username=admin@localhost
ejabberd.password=admin

springdoc.info.title=OpenPlaud Admin API
springdoc.info.version=0.0.1
springdoc.info.description=Management API for the OpenPlaud platform
